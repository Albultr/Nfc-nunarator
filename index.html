<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALBUL.TR NFC Etiket Yazıcı — Park Numaratörü & Sosyal Medya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        cockpit: {
                            bg: '#070A0F',
                            shell: '#0D121B',
                            card: '#131A26',
                            elevated: '#1A2333',
                            border: '#253147',
                            accent: '#3B82F6',
                            accentHover: '#2563EB',
                            cyan: '#06B6D4',
                            emerald: '#10B981',
                            danger: '#EF4444',
                        },
                    },
                },
            },
        };
    </script>
    <style>
        /* Otomobil kokpiti dokusu ve dokunma hassasiyeti */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #05070B;
            color: #F1F5F9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .cockpit-grid {
            background-image:
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.14), transparent 55%),
                linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
        }

        /* Sayısal giriş oklarını gizle */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button,
        input[type="tel"]::-webkit-inner-spin-button,
        input[type="tel"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Geçersiz girişte yatay sarsıntı animasyonu */
        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .animate-shake {
            animation: shakeX 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        /* Radar dalga halkaları */
        @keyframes radarWave {
            0% {
                transform: scale(0.78);
                opacity: 0.75;
            }
            100% {
                transform: scale(1.65);
                opacity: 0;
            }
        }

        .radar-wave-a {
            animation: radarWave 2.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        .radar-wave-b {
            animation: radarWave 2.1s cubic-bezier(0.16, 1, 0.3, 1) 1.05s infinite;
        }

        /* Yaklaşan NFC kart animasyonu */
        @keyframes tagApproach {
            0%, 100% {
                transform: translate(28px, 16px) rotate(11deg) scale(0.95);
            }
            50% {
                transform: translate(6px, -2px) rotate(3deg) scale(1.04);
            }
        }

        .tag-approach-anim {
            animation: tagApproach 2.2s ease-in-out infinite;
        }

        /* Başarı tik çizimi */
        @keyframes checkPop {
            0% {
                transform: scale(0.55);
                opacity: 0;
            }
            70% {
                transform: scale(1.08);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .check-pop-anim {
            animation: checkPop 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center sm:p-4 cockpit-grid">

    <!-- Ana Uygulama Konteyneri -->
    <div id="appShell" class="w-full sm:max-w-[420px] min-h-screen sm:min-h-[790px] sm:max-h-[860px] bg-cockpit-shell sm:rounded-[2.4rem] sm:border-[5px] sm:border-slate-800 shadow-[0_24px_80px_rgba(0,0,0,0.85)] flex flex-col justify-between relative overflow-hidden">

        <!-- Toast Bildirim Alanı (Üst Orta) -->
        <div id="toastBanner" class="pointer-events-none fixed sm:absolute top-4 left-1/2 -translate-x-1/2 z-[60] w-[90%] max-w-[360px] opacity-0 -translate-y-2 transition-all duration-200">
            <div id="toastInner" class="px-4 py-3 rounded-2xl border backdrop-blur-md shadow-xl text-xs font-medium flex items-center gap-2.5 bg-cockpit-elevated/95 border-cockpit-border text-slate-100">
                <span id="toastDot" class="w-2.5 h-2.5 rounded-full bg-blue-400 shrink-0"></span>
                <span id="toastText" class="leading-snug">Bildirim</span>
            </div>
        </div>

        <!-- Üst Başlık & Mod Göstergesi / Anahtarı -->
        <header class="px-5 pt-6 pb-4 border-b border-cockpit-border/70 bg-cockpit-bg/60 backdrop-blur-sm">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-11 h-11 rounded-2xl bg-blue-500/15 border border-blue-400/30 flex items-center justify-center text-blue-400 shrink-0 shadow-inner">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 8.32a7.43 7.43 0 0 1 0 7.36" />
                            <path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58" />
                            <path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8" />
                            <path d="M16.37 2a20.16 20.16 0 0 1 0 20" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-lg font-extrabold tracking-tight text-white truncate">NFC Etiket Yazıcı</h1>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span id="modeIndicatorDot" class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
                            <span id="modeIndicatorText" class="text-[11px] font-medium text-slate-300 truncate">Simülasyon Modu</span>
                        </div>
                    </div>
                </div>

                <!-- Simülasyon / Gerçek NFC Geçiş Anahtarı -->
                <button
                    id="toggleSimModeBtn"
                    type="button"
                    title="Simülasyon ve Gerçek NFC modu arasında geçiş yap"
                    class="px-3 py-2 rounded-xl bg-cockpit-elevated hover:bg-slate-800 border border-cockpit-border text-[11px] font-semibold text-slate-200 flex items-center gap-1.5 transition-colors cursor-pointer shrink-0 select-none"
                >
                    <span id="modeToggleLabel">Simülasyon: AÇIK</span>
                </button>
            </div>
        </header>

        <!-- Ana Çalışma Alanı -->
        <main class="flex-1 px-5 py-5 flex flex-col justify-center gap-4 overflow-y-auto">

            <!-- Mod Sekmeleri ("Telefon No" / "Sosyal Medya") -->
            <nav aria-label="Etiket içeriği türü" class="grid grid-cols-2 gap-1.5 p-1.5 rounded-2xl bg-cockpit-card border border-cockpit-border">
                <button
                    id="tabPhoneBtn"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all cursor-pointer select-none bg-blue-600 text-white shadow-md shadow-blue-600/25"
                >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    <span>Telefon No</span>
                </button>

                <button
                    id="tabSocialBtn"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer select-none text-slate-400 hover:text-white"
                >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                    </svg>
                    <span>Sosyal Medya</span>
                </button>
            </nav>

            <!-- SEKME 1: TELEFON NO -->
            <section id="phonePanel" class="bg-cockpit-card border border-cockpit-border rounded-3xl p-4 sm:p-5 shadow-lg">
                <div class="flex items-center justify-between mb-2.5">
                    <label for="phoneInput" class="text-xs font-bold uppercase tracking-wider text-slate-300">
                        Mobil Numara (Türkiye)
                    </label>
                    <button
                        id="clearPhoneBtn"
                        type="button"
                        class="text-xs font-medium text-slate-400 hover:text-white transition-colors hidden cursor-pointer"
                    >
                        Temizle
                    </button>
                </div>

                <div id="phoneInputWrapper" class="flex items-stretch rounded-2xl bg-cockpit-elevated border border-cockpit-border focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/25 overflow-hidden transition-all">
                    <span class="px-3.5 flex items-center justify-center text-base font-bold text-blue-400 bg-cockpit-bg/60 border-r border-cockpit-border select-none">
                        +90
                    </span>
                    <input
                        id="phoneInput"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        placeholder="5XX XXX XX XX"
                        maxlength="13"
                        class="w-full bg-transparent px-3.5 py-4 text-lg sm:text-xl font-bold tracking-wider text-white placeholder:text-slate-500 placeholder:font-normal focus:outline-none"
                    />
                </div>

                <!-- Canlı Arama Bağlantısı Önizlemesi -->
                <div class="mt-3 px-3 py-2 rounded-xl bg-cockpit-bg/80 border border-cockpit-border/70 flex items-center justify-between gap-2">
                    <span class="text-[11px] text-slate-400 shrink-0">Etiket Çıktısı:</span>
                    <span id="phonePreviewText" class="text-xs font-mono font-semibold text-blue-400 truncate">
                        tel:+905XXXXXXXXX
                    </span>
                </div>

                <!-- Doğrulama Hatası -->
                <p id="phoneErrorMsg" class="mt-2.5 text-xs font-medium text-rose-400 hidden flex items-center gap-1.5">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="phoneErrorText">Lütfen 5 ile başlayan 10 haneli geçerli bir cep telefonu numarası girin.</span>
                </p>
            </section>

            <!-- SEKME 2: SOSYAL MEDYA -->
            <section id="socialPanel" class="bg-cockpit-card border border-cockpit-border rounded-3xl p-4 sm:p-5 shadow-lg hidden flex-col gap-3.5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-300">
                        Platform Seçin
                    </span>
                    <button
                        id="clearSocialBtn"
                        type="button"
                        class="text-xs font-medium text-slate-400 hover:text-white transition-colors hidden cursor-pointer"
                    >
                        Temizle
                    </button>
                </div>

                <!-- Platform Hapları -->
                <div id="platformSelector" class="flex flex-wrap gap-1.5">
                    <button type="button" data-platform="instagram" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all cursor-pointer select-none bg-blue-600/20 border-blue-500 text-blue-300">
                        Instagram
                    </button>
                    <button type="button" data-platform="x" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-medium border transition-all cursor-pointer select-none bg-cockpit-elevated border-cockpit-border text-slate-300 hover:text-white">
                        X
                    </button>
                    <button type="button" data-platform="tiktok" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-medium border transition-all cursor-pointer select-none bg-cockpit-elevated border-cockpit-border text-slate-300 hover:text-white">
                        TikTok
                    </button>
                    <button type="button" data-platform="whatsapp" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-medium border transition-all cursor-pointer select-none bg-cockpit-elevated border-cockpit-border text-slate-300 hover:text-white">
                        WhatsApp
                    </button>
                    <button type="button" data-platform="telegram" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-medium border transition-all cursor-pointer select-none bg-cockpit-elevated border-cockpit-border text-slate-300 hover:text-white">
                        Telegram
                    </button>
                    <button type="button" data-platform="linkedin" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-medium border transition-all cursor-pointer select-none bg-cockpit-elevated border-cockpit-border text-slate-300 hover:text-white">
                        LinkedIn
                    </button>
                    <button type="button" data-platform="youtube" class="platform-btn px-3 py-1.5 rounded-xl text-xs font-medium border transition-all cursor-pointer select-none bg-cockpit-elevated border-cockpit-border text-slate-300 hover:text-white">
                        YouTube
                    </button>
                </div>

                <!-- Kullanıcı Adı / Numara Girişi -->
                <div id="socialInputWrapper" class="flex items-center rounded-2xl bg-cockpit-elevated border border-cockpit-border focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/25 overflow-hidden transition-all">
                    <span id="socialPrefixBadge" class="pl-3.5 pr-1.5 py-3.5 text-xs sm:text-sm font-semibold text-slate-400 select-none shrink-0">
                        instagram.com/
                    </span>
                    <input
                        id="socialHandleInput"
                        type="text"
                        autocomplete="off"
                        autocapitalize="none"
                        spellcheck="false"
                        placeholder="kullaniciadi"
                        class="w-full bg-transparent pr-3.5 py-3.5 text-base font-semibold text-white placeholder:text-slate-500 placeholder:font-normal focus:outline-none"
                    />
                </div>

                <!-- Canlı Bağlantı Önizlemesi -->
                <div class="px-3 py-2 rounded-xl bg-cockpit-bg/80 border border-cockpit-border/70 flex items-center justify-between gap-2">
                    <span class="text-[11px] text-slate-400 shrink-0">Hedef Link:</span>
                    <span id="socialPreviewUrl" class="text-xs font-mono font-semibold text-blue-400 truncate">
                        https://instagram.com/kullaniciadi
                    </span>
                </div>

                <!-- Sosyal Medya Doğrulama Hatası -->
                <p id="socialErrorMsg" class="text-xs font-medium text-rose-400 hidden flex items-center gap-1.5">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="socialErrorText">Lütfen geçerli bir kullanıcı adı girin.</span>
                </p>
            </section>

            <!-- Ana Aksiyon Butonları ("NFC'ye Yazdır" üstte, "NFC'yi Sil" altta) -->
            <div class="flex flex-col gap-3 pt-1">
                <button
                    id="writeActionBtn"
                    type="button"
                    class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 active:scale-[0.985] text-white font-bold text-base tracking-wide shadow-lg shadow-blue-600/30 border border-blue-400/30 flex items-center justify-center gap-2.5 transition-all cursor-pointer select-none"
                >
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>NFC'ye Yazdır</span>
                </button>

                <button
                    id="eraseActionBtn"
                    type="button"
                    class="w-full py-3.5 px-5 rounded-2xl bg-cockpit-card hover:bg-rose-950/35 active:scale-[0.985] text-slate-300 hover:text-rose-300 font-semibold text-sm border border-cockpit-border hover:border-rose-500/40 flex items-center justify-center gap-2 transition-all cursor-pointer select-none"
                >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span>NFC'yi Sil</span>
                </button>
            </div>
        </main>

        <!-- Alt Bilgi -->
        <footer class="px-5 py-4 text-center border-t border-cockpit-border/60 bg-cockpit-bg/
            <script>
  window.addEventListener('error', function(e) {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;z-index:999999;background:#7f1d1d;color:#fff;padding:12px;border-radius:10px;font-size:12px;font-family:monospace;';
    box.textContent = 'HATA: ' + e.message + ' (Satir: ' + e.lineno + ')';
    document.body.appendChild(box);
  });
</script>
</body>
            </html>
